<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scale Street — Product Manager</title><link rel="stylesheet" href="admin.css">
</head>
<body>
<main>
  <header><a href="index.html" class="brand">SCALE<span>STREET</span></a><span>PRODUCT MANAGER</span></header>
  <section class="panel">
    <h1>Store settings</h1>
    <p>Enter the real WhatsApp number and UPI ID. These values are exported into the static website.</p>
    <div class="grid2">
      <label>WhatsApp number<input id="wa" placeholder="919876543210"></label>
      <label>UPI ID<input id="upi" placeholder="yourname@upi"></label>
    </div>
  </section>
  <section class="panel">
    <h1>Add product</h1>
    <form id="productForm">
      <div class="grid2">
        <label>Product name<input id="name" required></label>
        <label>Brand<input id="brand"></label>
        <label>Scale<input id="scale" placeholder="1:64"></label>
        <label>Category<input id="category"></label>
        <label>Price (INR)<input id="price" type="number" min="0" required></label>
        <label>Stock<input id="stock" type="number" min="0" required></label>
      </div>
      <label>Description<textarea id="description" rows="4"></textarea></label>
      <label>Product image<input id="image" type="file" accept="image/*" required></label>
      <button class="button" type="submit">Add product</button>
    </form>
  </section>
  <section class="panel">
    <div class="row"><h1>Products</h1><button id="exportBtn" class="button">Export website data</button></div>
    <div id="products"></div>
  </section>
</main>
<script>
let items=[];const KEY="scaleStreetAdminProducts";
const settings=JSON.parse(localStorage.getItem("scaleStreetSettings")||"{}");
document.querySelector("#wa").value=settings.whatsappNumber||"";document.querySelector("#upi").value=settings.upiId||"";
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
const $=s=>document.querySelector(s);
function save(){localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem("scaleStreetSettings",JSON.stringify({whatsappNumber:$("#wa").value.trim(),upiId:$("#upi").value.trim()}));render();}
function render(){const box=$("#products");box.innerHTML=items.length?items.map((p,i)=>`<article class="item"><img src="${p.image}"><div><b>${esc(p.name)}</b><small>${esc(p.brand||"")} • ${esc(p.scale||"")} • ₹${Number(p.price).toLocaleString("en-IN")} • Stock ${p.stock} • <b class="${Number(p.stock)>0?"ok":"no"}">${Number(p.stock)>0?"In Stock":"Out Of Stock"}</b></small></div><button onclick="del(${i})">Delete</button></article>`).join(""):`<p class="muted">No products added yet.</p>`}
function del(i){if(confirm("Delete this product?")){items.splice(i,1);save()}}
$("#productForm").addEventListener("submit",e=>{e.preventDefault();const f=$("#image").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{items.push({id:crypto.randomUUID(),name:$("#name").value.trim(),brand:$("#brand").value.trim(),scale:$("#scale").value.trim(),category:$("#category").value.trim(),price:Number($("#price").value),stock:Number($("#stock").value),description:$("#description").value.trim(),image:r.result});save();e.target.reset();alert("Product added to this browser's local manager.");};r.readAsDataURL(f)});
$("#wa").addEventListener("change",save);$("#upi").addEventListener("change",save);
$("#exportBtn").addEventListener("click",()=>{
  const config={whatsappNumber:$("#wa").value.trim(),upiId:$("#upi").value.trim(),currency:"₹"};
  const productCode=`<script>window.SCALE_STREET_PRODUCTS = ${JSON.stringify(items)};window.SCALE_STREET_CONFIG = ${JSON.stringify(config)};<\/script>`;
  const baseIndex=`<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scale Street — Diecast Collectibles</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" id="nav">
    <a class="brand" href="index.html">SCALE<span>STREET</span></a>
    <nav>
      <a href="#collection">Collection</a>
      <a href="#about">About</a>
      <a href="#instagram">Instagram</a>
    </nav>
    <button class="cart-button" id="cartButton" aria-label="Open cart">Cart <span id="cartCount">0</span></button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy reveal">
        <p class="eyebrow">DIECAST • COLLECTIBLES</p>
        <h1>Collect.<br>Drive.<br><em>Repeat.</em></h1>
        <p class="hero-sub">Miniature machines for collectors who care about the details.</p>
        <a class="button primary" href="#collection">Explore collection</a>
      </div>
      <div class="hero-mark reveal">
        <div class="logo-ring">
          <div class="road-line"></div>
          <strong>SCALE<br><span>STREET</span></strong>
        </div>
      </div>
    </section>

    <section class="section" id="collection">
      <div class="section-head reveal">
        <div>
          <p class="eyebrow">THE GARAGE</p>
          <h2>Current collection.</h2>
        </div>
        <div class="tools">
          <input id="search" type="search" placeholder="Search cars..." autocomplete="off">
          <select id="categoryFilter" aria-label="Filter by category">
            <option value="all">All</option>
          </select>
        </div>
      </div>
      <div id="productGrid" class="product-grid"></div>
      <div id="emptyState" class="empty hidden">No products match your search.</div>
    </section>

    <section class="feature section reveal" id="about">
      <div>
        <p class="eyebrow">SCALE STREET</p>
        <h2>Small scale.<br><em>Big obsession.</em></h2>
      </div>
      <p>Built for diecast collectors. Browse the available collection, add what you want to your cart, pay through UPI, and send the finished order straight to WhatsApp.</p>
    </section>

    <section class="instagram section reveal" id="instagram">
      <p class="eyebrow">FOLLOW THE GARAGE</p>
      <h2>@scale__street</h2>
      <p>New drops, close-ups and collector updates.</p>
      <a class="button ghost" href="https://instagram.com/scale__street" target="_blank" rel="noopener">Open Instagram</a>

  </main>

    <div class="cart-head">
      <h2>Your cart</h2>
      <button id="closeCart" class="icon-button" aria-label="Close cart">×</button>

    <div class="cart-footer">
      <div class="total-row"><span>Total</span><strong id="cartTotal">₹0</strong></div>
      <button id="checkoutButton" class="button primary full">Checkout</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <dialog id="productDialog">
    <div id="productDetail"></div>
    <button class="dialog-close" onclick="document.getElementById('productDialog').close()">×</button>
  </dialog>

    <div class="checkout">

      <form id="checkoutForm">

        <label>WhatsApp number<input name="phone" type="tel" required></label>
        <label>Delivery address<textarea name="address" rows="3" required></textarea></label>
        <div class="upi-box">
          <span>UPI payment only</span>
          <strong id="upiId"></strong>
          <small>Complete the payment in your UPI app, then send the order on WhatsApp.</small>
        </div>
        <button class="button primary full" type="submit">Create WhatsApp Order</button>
      </form>
    </div>
  </dialog>

  <footer>
    <span>© Scale Street</span>

  <script src="products.js"><\/script>
  <script src="app.js"><\/script>

</html>
`;
  const standalone=baseIndex.replace('<script src="products.js"></script>',productCode).replace('<script src="app.js"></script>',`<script>const products = window.SCALE_STREET_PRODUCTS || [];
const config = window.SCALE_STREET_CONFIG || {whatsappNumber:"",upiId:"",currency:"₹"};
let cart = JSON.parse(localStorage.getItem("scaleStreetCart") || "[]");

const $ = s => document.querySelector(s);
const money = n => \`\${config.currency}\${Number(n).toLocaleString("en-IN")}\`;

function saveCart(){ localStorage.setItem("scaleStreetCart", JSON.stringify(cart)); renderCart(); }
function getProduct(id){ return products.find(p => p.id === id); }

function renderProducts(){
  const grid=$("#productGrid"), empty=$("#emptyState");
  const q=($("#search")?.value||"").toLowerCase().trim();
  const cat=$("#categoryFilter")?.value||"all";
  const list=products.filter(p=>
    (!q || [p.name,p.brand,p.category,p.scale].join(" ").toLowerCase().includes(q)) &&
    (cat==="all" || p.category===cat)
  );
  grid.innerHTML="";
  empty.classList.toggle("hidden", list.length!==0);
  list.forEach((p,i)=>{
    const card=document.createElement("article");
    card.className="product-card";
    card.innerHTML=\`<div class="product-image"><img src="\${escapeAttr(p.image)}" alt="\${escapeAttr(p.name)}" loading="lazy"></div>
      <div class="product-info"><h3>\${escapeHtml(p.name)}</h3><div class="muted">\${escapeHtml(p.brand||"")} \${p.scale?\`• \${escapeHtml(p.scale)}\`:""}</div>
      <div class="price">\${money(p.price)}</div><div class="stock-badge \${Number(p.stock)>0?"in-stock":"out-stock"}">\${Number(p.stock)>0?"In Stock":"Out Of Stock"}</div></div>\`;
    card.addEventListener("click",()=>openProduct(p.id));
    grid.appendChild(card);
    setTimeout(()=>card.classList.add("visible"),i*70);
  });
}
function renderCategories(){
  const select=$("#categoryFilter"); if(!select)return;
  [...new Set(products.map(p=>p.category).filter(Boolean))].sort().forEach(c=>{
    const o=document.createElement("option");o.value=c;o.textContent=c;select.appendChild(o);
  });
}
function renderCart(){
  const box=$("#cartItems"), count=$("#cartCount"), total=$("#cartTotal");
  const items=cart.map(x=>({...x,p:getProduct(x.id)})).filter(x=>x.p);
  count.textContent=cart.reduce((a,x)=>a+x.qty,0);
  box.innerHTML=items.length?items.map(x=>\`<div class="cart-item">
    <img src="\${escapeAttr(x.p.image)}" alt="">
    <div><h4>\${escapeHtml(x.p.name)}</h4><div class="muted">\${money(x.p.price)} each</div>
      <div class="qty"><button onclick="changeQty('\${x.p.id}',-1)">−</button><span>\${x.qty}</span><button onclick="changeQty('\${x.p.id}',1)">+</button></div>
    </div><button class="qty remove" onclick="removeItem('\${x.p.id}')">×</button>
  </div>\`).join(""):\`<div class="empty">Your cart is empty.</div>\`;
  total.textContent=money(items.reduce((a,x)=>a+x.p.price*x.qty,0));
}
function addToCart(id){
  const p=getProduct(id); if(!p || Number(p.stock)<=0)return;
  const found=cart.find(x=>x.id===id);
  if(found){ if(found.qty<Number(p.stock))found.qty++; }
  else cart.push({id,qty:1});
  saveCart(); openCart();
}
function changeQty(id,d){
  const item=cart.find(x=>x.id===id),p=getProduct(id);if(!item||!p)return;
  item.qty=Math.max(0,Math.min(Number(p.stock),item.qty+d));
  cart=cart.filter(x=>x.qty>0);saveCart();
}
function removeItem(id){cart=cart.filter(x=>x.id!==id);saveCart();}
function openCart(){ $("#cartPanel").classList.add("open");$("#backdrop").classList.add("show");$("#cartPanel").setAttribute("aria-hidden","false"); }
function closeCart(){ $("#cartPanel").classList.remove("open");$("#backdrop").classList.remove("show");$("#cartPanel").setAttribute("aria-hidden","true"); }
function openProduct(id){
  const p=getProduct(id);if(!p)return;
  $("#productDetail").innerHTML=\`<div class="detail"><img src="\${escapeAttr(p.image)}" alt="\${escapeAttr(p.name)}">
  <div class="detail-copy"><p class="eyebrow">\${escapeHtml(p.brand||"DIECAST")}\${p.scale?\` • \${escapeHtml(p.scale)}\`:""}</p>
  <h2>\${escapeHtml(p.name)}</h2><div class="price">\${money(p.price)}</div><p>\${escapeHtml(p.description||"")}</p>
  <p class="muted">\${Number(p.stock)>0?\`In Stock • \${p.stock} available\`:"Out Of Stock"}</p>
  <button class="button primary full" \${Number(p.stock)<=0?"disabled":""} onclick="addToCart('\${p.id}');document.getElementById('productDialog').close()">Add to cart</button></div></div>\`;
  $("#productDialog").showModal();
}
function checkout(){
  if(!cart.length)return;
  if(!config.whatsappNumber || !config.upiId){alert("The owner has not configured WhatsApp and UPI details yet.");return;}
  $("#upiId").textContent=config.upiId;
  $("#checkoutDialog").showModal();
}
function submitOrder(e){
  e.preventDefault();
  if(!config.whatsappNumber)return;
  const data=new FormData(e.target),items=cart.map(x=>({...x,p:getProduct(x.id)})).filter(x=>x.p);
  const total=items.reduce((a,x)=>a+x.p.price*x.qty,0);
  let msg=\`Hello Scale Street! 👋%0A%0AI would like to place an order.%0A%0AORDER%0A━━━━━━━━━━━━━━%0A\`;
  items.forEach((x,i)=>msg+=\`\${i+1}. \${x.p.name}%0A   Qty: \${x.qty}%0A   \${money(x.p.price*x.qty)}%0A\`);
  msg+=\`━━━━━━━━━━━━━━%0ATOTAL: \${money(total)}%0A%0ACUSTOMER%0AName: \${data.get("name")}%0AWhatsApp: \${data.get("phone")}%0AAddress: \${data.get("address")}%0APayment: UPI%0AUPI ID: \${config.upiId}%0A%0APlease confirm my order.\`;
  window.open(\`https://wa.me/\${config.whatsappNumber}?text=\${msg}\`,"_blank","noopener");
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function escapeAttr(v){return escapeHtml(v);}

document.addEventListener("DOMContentLoaded",()=>{
  renderCategories();renderProducts();renderCart();
  $("#search")?.addEventListener("input",renderProducts);$("#categoryFilter")?.addEventListener("change",renderProducts);
  $("#cartButton")?.addEventListener("click",openCart);$("#closeCart")?.addEventListener("click",closeCart);$("#backdrop")?.addEventListener("click",closeCart);
  $("#checkoutButton")?.addEventListener("click",checkout);$("#checkoutForm")?.addEventListener("submit",submitOrder);
  window.addEventListener("scroll",()=>$("#nav").classList.toggle("scrolled",scrollY>20));
  const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("visible")}),{threshold:.12});
  document.querySelectorAll(".reveal").forEach(e=>observer.observe(e));
});<\/script>`);
  const final=standalone.replace('<link rel="stylesheet" href="style.css">',`<style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#07090b;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 70% 15%,rgba(255,176,0,.09),transparent 28%),radial-gradient(circle at 10% 70%,rgba(255,255,255,.04),transparent 25%);z-index:-1}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.nav{position:fixed;z-index:20;top:0;left:0;right:0;height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;transition:.35s;background:transparent}.nav.scrolled{background:rgba(7,9,11,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,.07)}.brand{font-weight:900;letter-spacing:-.05em;font-size:1.1rem}.brand span{color:#ffb000}.nav nav{display:flex;gap:28px;font-size:.9rem;color:#aaa}.nav nav a{transition:.25s}.nav nav a:hover{color:#fff}.cart-button,.icon-button{border:0;color:#fff;background:rgba(255,255,255,.08);border-radius:999px;padding:10px 15px;cursor:pointer;transition:.2s}.cart-button:hover,.icon-button:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}#cartCount{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:5px;background:#ffb000;color:#080808;border-radius:50%;font-size:.72rem;font-weight:800}.hero{min-height:100svh;padding:150px 8vw 90px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:50px}.eyebrow{font-size:.72rem;letter-spacing:.18em;color:#888;font-weight:800}.hero h1{font-size:clamp(4rem,9vw,9rem);line-height:.82;letter-spacing:-.075em;margin:25px 0}.hero h1 em,.feature em{font-style:normal;color:#ffb000}.hero-sub{max-width:430px;color:#aaa;font-size:1.05rem;line-height:1.6;margin-bottom:30px}.butto /* Cross-device / browser-friendly refinements */
img,svg,video{max-width:100%}
button,a,input,select,textarea{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #ffb000;outline-offset:3px}
.stock-badge{display:inline-flex;align-items:center;width:max-content;margin-top:9px;padding:5px 9px;border-radius:999px;font-size:.7rem;font-weight:800;letter-spacing:.01em}
.stock-badge.in-stock{background:rgba(66,210,126,.11);color:#7fe6a0;border:1px solid rgba(66,210,126,.2)}
.stock-badge.out-stock{background:rgba(255,86,86,.10);color:#ff9b9b;border:1px solid rgba(255,86,86,.18)}
.product-card:has(.out-stock){opacity:.82}
.product-card:has(.out-stock) .product-image{filter:saturate(.72)}
.product-card:has(.out-stock) .product-info{cursor:default}

/* Very wide displays */
@media (min-width:1600px){
  .hero{padding-left:10vw;padding-right:10vw}
  .section{padding-left:10vw;padding-right:10vw}
  .product-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}

/* Tablets */
@media (min-width:561px) and (max-width:1100px){
  .hero{padding-left:6vw;padding-right:6vw}
  .section{padding-left:5vw;padding-right:5vw}
  .product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .nav{padding-left:4vw;padding-right:4vw}
}

/* Small phones */
@media (max-width:430px){
  .nav{height:64px}
  .brand{font-size:1rem}
  .cart-button{padding:9px 12px;font-size:.82rem}
  .hero{min-height:auto;padding-top:110px;padding-bottom:70px}
  .hero-mark{margin-bottom:8px}
  .logo-ring{width:min(78vw,290px)}
  .hero h1{font-size:clamp(3.35rem,18vw,4.2rem)}
  .hero-sub{font-size:.95rem}
  .section{padding-top:65px;padding-bottom:65px}
  .section h2{font-size:2.65rem}
  .product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .product-card{border-radius:16px}
  .product-info{padding:11px}
  .product-info h3{font-size:.88rem}
  .muted{font-size:.72rem}
  .price{font-size:.9rem;margin-top:10px}
  .stock-badge{font-size:.62rem;padding:4px 7px}
  .tools{display:grid;grid-template-columns:1fr 1fr}
  .tools input,.tools select{width:100%;font-size:.82rem;padding:11px}
  .cart-panel{padding:20px 16px}
  .cart-item{grid-template-columns:58px 1fr auto}
  .cart-item img{width:58px;height:58px}
  .detail-copy{padding:25px 20px 28px}
  .detail-copy h2{font-size:2rem}
  footer{gap:15px;flex-direction:column}
}

/* Tiny / older mobile browser fallback */
@media (max-width:340px){
  .product-grid{grid-template-columns:1fr}
  .tools{grid-template-columns:1fr}
  .hero h1{font-size:3.1rem}
}

/* Landscape phones */
@media (max-height:500px) and (orientation:landscape){
  .hero{min-height:auto;padding-top:105px;padding-bottom:70px}
  .logo-ring{width:220px}
}

/* Reduced motion / accessibility */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* Avoid hover-only behavior on touch devices */
@media (hover:none){
  .product-card:hover{transform:none;box-shadow:none}
  .product-card:hover img{transform:none}
  .button:hover{transform:none;box-shadow:none}
}
